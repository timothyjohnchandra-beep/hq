<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd60a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HQ">
<title>Timothy HQ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday, calm, personal: a daily notebook that runs a busy week
   IDEA Apple Notes: paper-white sheets, grouped lists, one warm yellow
   PICTURE the Today list itself, times hanging large on the left
   COLOUR paper white, graphite ink, notes yellow accent, soft world tints
   TYPE Inter (system feel) + Source Serif 4 for reading
   LAYOUT phone: one column + bottom tabs; wide: sidebar, list, detail pane */
:root{color-scheme:light dark;
--bg:light-dark(#f2f2f7,#000);--card:light-dark(#fff,#1c1c1e);--ink:light-dark(#1c1c1e,#f2f2f7);
--mut:light-dark(#86868b,#98989d);--line:light-dark(#e3e3e8,#2c2c2e);--fill:light-dark(#ececf0,#2c2c2e);
--acc:light-dark(#d69e00,#ffd60a);--accfill:#ffd60a;--accsoft:light-dark(#fff6d1,#3a3210);
--church:light-dark(#5b5bd6,#9d9df5);--company:light-dark(#0a84a0,#5ac8e0);--personal:light-dark(#d1547a,#ff8fb0);
--red:light-dark(#d70015,#ff6961);--green:light-dark(#248a3d,#30d158);
--hl-y:light-dark(#ffe98a,#6b5a00);--hl-g:light-dark(#c9f2c2,#1f4d24);--hl-b:light-dark(#cfe4ff,#173a63);--hl-p:light-dark(#ffd3e2,#5c1f33)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;height:100%;grid-template-columns:220px minmax(0,1fr) minmax(0,1.1fr)}
.side{background:var(--card);border-right:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 12px 16px;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:20px;padding:4px 10px 14px;letter-spacing:-.02em}
.brand span{color:var(--acc)}
.brand{display:flex;align-items:center;gap:10px}
.mono{width:34px;height:34px;border-radius:9px;background:#fff;color:#1c1c1e !important;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.04em}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lk{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:8px 14px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;min-height:40px;border:1px solid var(--line)}
.lk i{width:8px;height:8px;border-radius:50%;display:inline-block}
.meta a{color:var(--acc);font-weight:600;text-decoration:none}
.tab{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:10px;text-align:left;font-weight:500;min-height:44px}
.tab svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=true]{background:var(--accsoft);color:var(--ink)}
.tab[aria-current=true] svg{stroke:var(--acc)}
.sidefoot{margin-top:auto;font-size:13px;color:var(--mut);padding:10px}
main{overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
.pane{background:var(--card);border-left:1px solid var(--line);overflow-y:auto;position:relative}
.pane-empty{height:100%;display:grid;place-items:center;color:var(--mut);padding:24px;text-align:center}
h1{font-size:34px;line-height:1.05;letter-spacing:-.02em;margin:0 0 2px;font-weight:700}
.sub{color:var(--mut);font-size:15px;margin:0 0 18px}
h2{font-size:20px;letter-spacing:-.01em;margin:26px 0 8px;font-weight:700;display:flex;align-items:center;gap:8px}
.emails .em{border-bottom:1px solid var(--line)}.emails .em:last-child{border-bottom:0}
.em>summary{list-style:none;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;cursor:pointer}.em>summary::-webkit-details-marker{display:none}
.em-dot{width:8px;height:8px;border-radius:4px;background:#0a84ff}.em-dot.imp{background:#ffd60a;box-shadow:0 0 0 1px #c69500}
.em-t{min-width:0;display:flex;flex-direction:column}.em-t b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.em-t span{font-size:14px;color:var(--mut,#6e6e73);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em[open] .em-t span{white-space:normal}.em-w{font-size:12px;color:var(--mut,#6e6e73);align-self:start;padding-top:3px;white-space:nowrap}
.em-b{padding:0 14px 12px 34px}.em-g{white-space:pre-line;font-size:14px;line-height:1.5;margin:0 0 8px;max-height:16em;overflow:auto}
.smentry{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:12px;padding:12px 14px;margin:6px 0 14px;font:inherit;color:inherit;cursor:pointer}.smentry b{display:block;font-size:16px}.smentry span span{font-size:13px;color:var(--mut)}
.smh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.smh h1{margin:4px 0 10px}
.seg3{display:flex;gap:4px;background:rgba(120,120,128,.16);border-radius:9px;padding:2px;margin-bottom:10px}.seg3 button{flex:1;min-height:0!important;line-height:1.2;border:0;background:none;border-radius:7px;padding:7px 4px;font:inherit;font-size:13px;color:inherit;cursor:pointer}.seg3 button.on{background:var(--card);font-weight:600}
.smsearch{display:flex;align-items:center;gap:8px;background:rgba(120,120,128,.14);border-radius:10px;padding:0 12px;margin-bottom:10px}.smsearch svg{width:17px;height:17px;stroke:var(--mut);fill:none;stroke-width:2}.smsearch input{border:0!important;background:none!important;box-shadow:none!important;padding:0!important;min-height:40px;font-size:15px;flex:1}.smsearch input:focus{outline:none}
.smfs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;align-items:center}.smf{flex:none;position:relative}.smf select{width:auto!important;min-height:0!important;margin:0!important;line-height:32px;appearance:none;-webkit-appearance:none;height:34px;border-radius:17px;border:1px solid var(--line);background:var(--card);padding:0 14px;font:inherit;font-size:13px;color:inherit;max-width:180px}.smf.on select{background:#111;color:#fff;border-color:#111}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bmap{padding:10px 12px}.bl{display:block;font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin:8px 0 4px}.bg{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.bt{border:0;border-radius:6px;height:28px;padding:0;font:600 10px Inter,sans-serif;cursor:pointer;color:#3c3c43}.bt:disabled{cursor:default;opacity:.55}.bt.l0{background:rgba(120,120,128,.14)}.bt.l1{background:#fff3b0}.bt.l2{background:#ffe066}.bt.l3{background:#ffd60a;color:#111}.bt.l4{background:#b38900;color:#fff}.bt.sel{outline:2px solid var(--ink,#111);outline-offset:1px}
.smc{display:flex;flex-direction:column;align-items:flex-start;gap:5px;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:inherit;cursor:pointer}.smc:last-child{border-bottom:0}.smc b{font-size:16px}.smc ol{margin:0;padding-left:18px;font-size:13px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:5px}.vchip{font-size:11px;font-weight:600;background:#fff0a8;color:#4a3b00;padding:2px 7px;border-radius:6px}.tchip{font-size:11px;background:rgba(120,120,128,.14);padding:2px 7px;border-radius:6px}
.vpanel .prow{margin:6px 0 4px}.vsec{margin-top:14px}.vsec>summary{list-style:none;cursor:pointer;font-weight:700;font-size:17px;padding:6px 0;display:flex;gap:8px;align-items:center}.vsec>summary::-webkit-details-marker{display:none}
.vrow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:inherit;cursor:pointer}.vrow:last-child{border-bottom:0}
.vrow b{font-size:15px}.vd,.vf{font-size:12px;color:var(--mut)}.vx{font-size:14px;line-height:1.45;color:var(--ink,#111);opacity:.85}
.edgeback{position:fixed;left:0;width:44px;height:44px;border-radius:22px;background:rgba(120,120,128,.25);color:#111;font-size:30px;line-height:40px;text-align:center;z-index:99;pointer-events:none;transition:background .15s}.edgeback.go{background:#ffd60a}
.tsec>summary{list-style:none;cursor:pointer;-webkit-tap-highlight-color:transparent}.tsec>summary::-webkit-details-marker{display:none}
.tsec>summary h2{margin:22px 0 8px}.tsec>summary h2::before{content:'';width:8px;height:8px;border-right:2px solid var(--y2,#c69500);border-bottom:2px solid var(--y2,#c69500);transform:rotate(45deg);margin:0 4px 3px 2px;transition:transform .2s;flex:none}
.tsec:not([open])>summary h2::before{transform:rotate(-45deg);margin-bottom:0}.tsec:not([open])>summary h2{margin:14px 0 4px;opacity:.85}
.tsub{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-direction:row-reverse}.tsall{font-size:14px}
h2 .n{font-size:13px;font-weight:600;color:var(--mut)}
h2 .act{margin-left:auto}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 58px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-height:52px}
.row:last-child{border-bottom:0}
.row:hover{background:color-mix(in srgb,var(--fill) 50%,transparent)}
.row.nt{grid-template-columns:auto minmax(0,1fr) auto}
.time{font-weight:600;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.time small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.ttl{font-weight:500;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--mut);margin-top:1px}
.leave{color:var(--red);font-weight:600}
.done .ttl{text-decoration:line-through;color:var(--mut)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid color-mix(in srgb,var(--mut) 60%,transparent);background:none;display:grid;place-items:center;padding:0;flex:none}
.chk.sq{border-radius:7px}
.chk svg{width:14px;height:14px;stroke:#1c1c1e;stroke-width:3;fill:none;opacity:0}
.done .chk,.chk.on{background:var(--accfill);border-color:var(--accfill)}
.done .chk svg,.chk.on svg{opacity:1}
.pop{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
.w-church{background:var(--church)}.w-company{background:var(--company)}.w-personal{background:var(--personal)}
.pill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--fill);color:var(--mut);white-space:nowrap}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;font-size:15px;background:var(--fill);min-height:40px}
.btn.y{background:var(--accfill);color:#1c1c1e}
.btn.link{background:none;color:var(--acc);padding:6px 4px;min-height:0}
.brief{background:var(--accsoft);border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(13em,1fr));gap:14px 22px}
.brief b{display:block;font-size:13px;color:var(--mut);font-weight:600;margin-bottom:3px}
.brief p{margin:0;font-size:15px}
.big{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.quick input{flex:1 1 220px}
input[type=text],input[type=date],input[type=search],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;min-height:44px;width:100%}
.quick select{width:auto}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 10px;font-size:14px;font-weight:600;color:var(--mut);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:10px 0 4px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.top3{display:grid;grid-template-columns:repeat(auto-fit,minmax(12em,1fr));gap:10px}
.pcard{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.pcard .ttl{font-size:17px}
.prow{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.wa{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 12px;background:#25d366;color:#04391a;font-weight:600;font-size:14px;text-decoration:none;min-height:40px}
.blind{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bcard{background:var(--card);border-radius:14px;padding:12px 14px;border:2px solid transparent;text-align:left}
.bcard[aria-pressed=true]{border-color:var(--acc)}
.bcard .big{font-size:26px}
.bcard span{font-size:13px;color:var(--mut);display:block}
.folders .row{grid-template-columns:auto minmax(0,1fr) auto}
.folders svg{width:20px;height:20px;stroke:var(--acc);fill:none;stroke-width:1.8}
.note-snip{font-size:14px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.detail{padding:calc(16px + env(safe-area-inset-top,0px)) 22px 40px}
.dhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-height:44px}
.back{display:none}
.tools{display:flex;gap:4px;flex-wrap:wrap;position:sticky;top:0;background:var(--card);padding:6px 0;border-bottom:1px solid var(--line);margin-bottom:10px;z-index:2}
.tools button{border:0;background:var(--fill);border-radius:8px;min-width:38px;height:38px;padding:0 9px;font-size:14px;font-weight:600}
.sw{width:22px;height:22px;border-radius:50%;display:inline-block;vertical-align:middle;border:1px solid var(--line)}
.ed{min-height:50vh;outline:none;font-size:17px;line-height:1.55}
.ed h1{font-size:28px;margin:.4em 0 .2em}
.ed h2{font-size:21px;margin:.8em 0 .2em;display:block}
.ed hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.ed mark,.reader mark{border-radius:3px;padding:0 1px;color:inherit}
.m-y{background:var(--hl-y)}.m-g{background:var(--hl-g)}.m-b{background:var(--hl-b)}.m-p{background:var(--hl-p)}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--mut)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.rgoal{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:16px;padding:12px 16px;margin:4px 0 10px}.rgoal svg{width:54px;height:54px;flex:none}.rgoal b{font-size:15px}
.search{width:100%;margin:2px 0 6px;padding:10px 14px;border-radius:12px;border:0;background:var(--card);font:inherit;font-size:16px;color:var(--ink)}
.lcat button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}.lcat .chev{margin-left:auto;color:var(--mut);font-weight:400}
.brow{border-bottom:.5px solid var(--line)}.brow:last-child{border-bottom:0}
.bhead{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;border:0;background:none;padding:10px 14px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.bhead .bt{display:flex;flex-direction:column;min-width:0}.bhead .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bhead .chev{color:var(--mut);transition:transform .2s}.brow.open .bhead .chev{transform:rotate(90deg)}
.bthumb{width:44px;height:64px;border-radius:2px 5px 5px 2px;overflow:hidden;display:block;box-shadow:inset 3px 0 0 rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.18);background:#ddd}
.bthumb img{width:100%;height:100%;object-fit:cover;display:block}.bthumb b{display:flex;width:100%;height:100%;padding:4px;color:#fff;font:600 7.5px/1.15 "Source Serif 4",Georgia,serif;overflow:hidden}
.bexp{padding:0 16px 16px 70px}.bexp p{margin:6px 0;font-size:15px;line-height:1.5}.bexp h4{margin:12px 0 2px;font-size:13px;color:var(--mut);font-weight:600}.bexp ul{margin:4px 0 0;padding-left:18px}.bexp li{margin:3px 0;font-size:15px}.bexp .prow{margin-top:12px}
.bcat .pill{font-size:12px}
@media(max-width:700px){.bexp{padding:0 14px 14px 14px}}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:18px 14px}
.book{border:0;background:none;padding:0;text-align:left}
.cover{aspect-ratio:2/3;border-radius:4px 8px 8px 4px;padding:12px 10px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:inset 6px 0 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.18);font-family:"Source Serif 4",Georgia,serif}
.cover b{font-size:16px;line-height:1.15}
.cover i{font-size:12px;opacity:.85;font-style:normal}
.bar{height:4px;background:var(--fill);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.cont{display:grid;grid-template-columns:90px minmax(0,1fr);gap:16px;background:var(--card);border-radius:16px;padding:14px;align-items:center;margin-bottom:8px;cursor:pointer}
.reader{font-family:"Source Serif 4",Georgia,serif;line-height:1.7;max-width:36em;margin:0 auto}
.reader p{margin:0 0 1em}
.reader h3{font-size:22px;margin:.4em 0 1em;font-weight:600}
.hlbar{position:sticky;bottom:12px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.hlbar .btn{box-shadow:0 2px 10px rgba(0,0,0,.18)}
.hit mark{background:var(--hl-y)}
.empty{padding:16px;color:var(--mut);font-size:15px}
.samp{font-size:13px;color:var(--mut);margin:22px 0 0}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;max-width:min(92vw,460px);z-index:50}
#toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:1100px){.app{grid-template-columns:200px minmax(0,1fr)}.pane{position:fixed;inset:0 0 0 auto;width:min(560px,100%);transform:translateX(100%);transition:transform .28s;z-index:20;box-shadow:-8px 0 30px rgba(0,0,0,.15)}.pane.open{transform:none}.back{display:inline-flex}}
@media(max-width:700px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
.side{grid-row:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));justify-content:space-around}
.brand,.sidefoot{display:none}.tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;flex:1;align-items:center}.tab[aria-current=true]{background:none;color:var(--acc)}
.pane{width:100%}main{padding-left:16px;padding-right:16px}h1{font-size:32px}.blind{gap:6px}.bcard{padding:10px}.row{grid-template-columns:auto 50px minmax(0,1fr) auto;padding:10px 12px}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}.pane,#toast{transition:none}}

.sync{font-size:13px;color:var(--mut);min-height:20px;margin:-6px 0 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

{
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=t=>`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;

async function api(params){
 const u=new URL(cfg.url);u.searchParams.set('token',cfg.token);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
 let r;try{r=await fetch(u.toString(),{redirect:'follow'})}catch(e){throw new Error(navigator.onLine?'Google could not be reached. Check the script address in Settings.':'You are offline. Changes are kept and will sync later.')}
 if(!r.ok)throw new Error('Google answered with error '+r.status);
 let j;try{j=await r.json()}catch(e){throw new Error('The script did not answer properly. Is it deployed with access for Anyone?')}
 if(!j.ok)throw new Error(j.error||'Unknown error from the script');return j}
async function post(body){
 let r;try{r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,token:cfg.token})})}catch(e){throw new Error(navigator.onLine?'Google could not be reached.':'You are offline. Changes are kept and will sync later.')}
 let j;try{j=await r.json()}catch(e){throw new Error('The script did not answer properly.')}
 if(!j.ok)throw new Error(j.error||'Unknown error from the script');return j}

let flushing=false;
async function flush(){
 if(!live()||flushing||(!dirty.size&&!dirtyNotes.size))return;flushing=true;syncState={s:'saving'};showSync();
 try{
  for(const id of [...dirtyNotes]){const n=D.notes_index.find(x=>x.id===id);if(!n){dirtyNotes.delete(id);continue}
   const j=await post({action:'note',id,title:n.title,html:BODY[id]||''});n.driveLink=j.driveLink;dirtyNotes.delete(id);dirty.add('notes_index')}
  for(const t of [...dirty]){try{await post({action:'save',name:t,rows:D[t]});dirty.delete(t);if(CASH_TABS.includes(t))cashNeedsScript=false}catch(err){if(CASH_TABS.includes(t)&&/Unknown tab|Tab missing/.test(err.message)){cashNeedsScript=true;continue}throw err}}
  syncState={s:'ok',at:hm(new Date())}}
 catch(e){syncState={s:'error',msg:e.message}}
 flushing=false;persist();showSync();if((dirty.size&&![...dirty].every(t=>CASH_TABS.includes(t)&&cashNeedsScript))||dirtyNotes.size)if(syncState.s==='ok')flush()}
async function load(){
 if(!live()){syncState={s:'sample'};showSync();ensure();render();return}
 if(D){ensure();render()}
 syncState={s:'loading'};showSync();
 try{
  if(dirty.size||dirtyNotes.size)await flush();
  const j=await api({action:'all'});const keep=D||{};D=j.data;cashNeedsScript=!Array.isArray(j.data.cash_entries);TABS.forEach(t=>{if((dirty.has(t)||!Array.isArray(D[t]))&&keep[t])D[t]=keep[t]});ensure();persist();
  syncState={s:'ok',at:hm(new Date())};render();
  api({action:'calendar',days:2}).then(c=>{EV=c.events;ls.set('hq-ev',EV);if(UI.view==='today')render()}).catch(e=>{syncState={s:'error',msg:'Calendar: '+e.message};showSync()});
